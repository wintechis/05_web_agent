# Default config for inference. input_folder/output_folder are set from dataset_paths
# (from the selected datasource) and the experiment's dataset (dbpedia | wikipedia).
# _self_ ensures this file is the base.
defaults:
  - _self_
  - datasource: experiment_10
  - experiment: semantic_outgoing_turtle
  - model: qwen3_coder_30b

# dataset_paths come from the selected datasource (config/datasource/*.yaml)

# Override from CLI or leave unset to use dataset_paths[dataset]
input_folder: null
output_folder: null
trace_dir: null

# Agent behaviour overrides — null means "use experiment config or .env fallback"
# Set to true/false on the CLI to override the experiment YAML, e.g.:
#   python run_inference_hydra.py path_validation=true
#   python run_inference_hydra.py thinking_mode=false
scratchpad_mode: null
thinking_mode: null
plan_mode: null
path_validation: null
compression_strategy: null
compression_keep_full_last_n: null
