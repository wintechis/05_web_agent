hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - datasource=experiment_17
    - model=nemotron-3-super-120-a12b
    - experiment=compression_dbpedia_html_path_validation,compression_dbpedia_html_plan,compression_dbpedia_html_recency_uri,compression_dbpedia_html_scratchpad,compression_dbpedia_html_thinking,compression_dbpedia_html_tiered,compression_dbpedia_html,compression_dbpedia_jsonld,compression_dbpedia_turtle_path_validation,compression_dbpedia_turtle_plan,compression_dbpedia_turtle_recency_uri,compression_dbpedia_turtle_scratchpad,compression_dbpedia_turtle_thinking,compression_dbpedia_turtle_tiered,compression_dbpedia_turtle,compression_wikipedia_html_markdown_path_validation,compression_wikipedia_html_markdown_plan,compression_wikipedia_html_markdown_recency_uri,compression_wikipedia_html_markdown_scratchpad,compression_wikipedia_html_markdown_thinking,compression_wikipedia_html_markdown_tiered,compression_wikipedia_html_markdown,compression_wikipedia_wikitext_markdown_path_validation,compression_wikipedia_wikitext_markdown_plan,compression_wikipedia_wikitext_markdown_recency_uri,compression_wikipedia_wikitext_markdown_scratchpad,compression_wikipedia_wikitext_markdown_thinking,compression_wikipedia_wikitext_markdown_tiered,compression_wikipedia_wikitext_markdown,crn_dbpedia,crn_wikipedia,env_dbpedia_raw_html,env_dbpedia_raw_jsonld,env_dbpedia_raw_turtle,env_wikipedia_raw_html,semantic_in_and_outgoing_jsonld,semantic_in_and_outgoing_turtle,semantic_outgoing_jsonld,semantic_outgoing_turtle,semantic_wikipedia_html_wikitext,syntactic_dbpedia_compact_jsonld,syntactic_dbpedia_markdown_html,syntactic_dbpedia_turtle_light,syntactic_wikipedia_markdown_html
  job:
    name: run_inference_hydra
    chdir: null
    override_dirname: datasource=experiment_17,experiment=compression_dbpedia_html_path_validation,compression_dbpedia_html_plan,compression_dbpedia_html_recency_uri,compression_dbpedia_html_scratchpad,compression_dbpedia_html_thinking,compression_dbpedia_html_tiered,compression_dbpedia_html,compression_dbpedia_jsonld,compression_dbpedia_turtle_path_validation,compression_dbpedia_turtle_plan,compression_dbpedia_turtle_recency_uri,compression_dbpedia_turtle_scratchpad,compression_dbpedia_turtle_thinking,compression_dbpedia_turtle_tiered,compression_dbpedia_turtle,compression_wikipedia_html_markdown_path_validation,compression_wikipedia_html_markdown_plan,compression_wikipedia_html_markdown_recency_uri,compression_wikipedia_html_markdown_scratchpad,compression_wikipedia_html_markdown_thinking,compression_wikipedia_html_markdown_tiered,compression_wikipedia_html_markdown,compression_wikipedia_wikitext_markdown_path_validation,compression_wikipedia_wikitext_markdown_plan,compression_wikipedia_wikitext_markdown_recency_uri,compression_wikipedia_wikitext_markdown_scratchpad,compression_wikipedia_wikitext_markdown_thinking,compression_wikipedia_wikitext_markdown_tiered,compression_wikipedia_wikitext_markdown,crn_dbpedia,crn_wikipedia,env_dbpedia_raw_html,env_dbpedia_raw_jsonld,env_dbpedia_raw_turtle,env_wikipedia_raw_html,semantic_in_and_outgoing_jsonld,semantic_in_and_outgoing_turtle,semantic_outgoing_jsonld,semantic_outgoing_turtle,semantic_wikipedia_html_wikitext,syntactic_dbpedia_compact_jsonld,syntactic_dbpedia_markdown_html,syntactic_dbpedia_turtle_light,syntactic_wikipedia_markdown_html,model=nemotron-3-super-120-a12b
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/dorene/Documents/repositories/05_web_agent
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/dorene/Documents/repositories/05_web_agent/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      model: nemotron-3-super-120-a12b
      experiment: semantic_outgoing_turtle
      datasource: experiment_17
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
