[project]
name = "05-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "httpx[http2]>=0.28.1",
    "loguru>=0.7.3",
    "markdownify>=1.2.2",
    "pyld>=2.0.0",
    "rdflib>=7.0.0",
    "openinference-instrumentation-openai>=0.1.0",
    "pyyaml>=6.0.2",
    "pyoxigraph>=0.5.4",
    "hydra-core>=1.3.0",
    "python-dotenv>=1.2.1",
    "pi-ai",
    "pi-agent",
    "uvicorn[standard]>=0.32.0",
    "sparqlwrapper>=2.0.0",
]

[tool.uv.sources]
pi-ai = { path = "../pi-mono-python/packages/ai", editable = false }
pi-agent = { path = "../pi-mono-python/packages/agent", editable = false }

[tool.uv]
override-dependencies = ["pi-ai @ file:///${PROJECT_ROOT}/../pi-mono-python/packages/ai"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


